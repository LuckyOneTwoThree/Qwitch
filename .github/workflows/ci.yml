name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Shell script syntax check
        if: runner.os != 'Windows'
        run: bash -n scripts/export_trae_profile.sh scripts/check_device_isolation.sh scripts/trae_probe.sh

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Tauri build (no-bundle smoke check)
        # Validates the full Tauri pipeline (frontend embed + release compile +
        # tauri.conf/capabilities/CSP) without packaging installers or signing.
        run: npm run tauri build -- --no-bundle
