name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.2.4)"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Verify release tag matches project versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          EXPECTED_VER="${TAG#v}"
          PKG_VER="$(node -pe "require('./package.json').version")"
          TAURI_VER="$(node -pe "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VER="$(node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("src-tauri/Cargo.toml", "utf8").split(/\r?\n/);
            let inPkg = false;
            for (const line of lines) {
              const t = line.trim();
              if (t.startsWith("[")) { inPkg = (t === "[package]"); continue; }
              if (inPkg) {
                const m = t.match(/^version\s*=\s*"([^"]+)"/);
                if (m) { console.log(m[1]); process.exit(0); }
              }
            }
            process.exit(1);
          ')"
          echo "Tag: $TAG | Expected: $EXPECTED_VER | package.json: $PKG_VER | tauri.conf.json: $TAURI_VER | Cargo.toml: $CARGO_VER"
          if [ "$PKG_VER" != "$EXPECTED_VER" ] || [ "$TAURI_VER" != "$EXPECTED_VER" ] || [ "$CARGO_VER" != "$EXPECTED_VER" ]; then
            echo "Version mismatch against tag $TAG" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
              echo "Tag $TAG already points to $TAG_SHA, refusing to overwrite from $TARGET_SHA" >&2
              exit 1
            fi
          fi
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-latest
            rust_targets: "aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            expected_arch: "arm64"
            artifact_name: "release-macos-arm64"
            run_tests: true
          - platform: macos-latest
            rust_targets: "x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
            expected_arch: "x86_64"
            artifact_name: "release-macos-x64"
            run_tests: false
          - platform: windows-latest
            rust_targets: "x86_64-pc-windows-msvc"
            rust_target: "x86_64-pc-windows-msvc"
            expected_arch: ""
            artifact_name: "release-windows-x64"
            run_tests: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust format check
        if: matrix.run_tests
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        if: matrix.run_tests
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        if: matrix.run_tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Build Tauri bundles
        # macOS 代码签名/公证通过下列 secrets 注入（缺失时自动回落 ad-hoc 未签名构建）：
        #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
        #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target ${{ matrix.rust_target }}

      - name: Stage macOS architecture artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          BIN="src-tauri/target/${TARGET}/release/bundle/macos/Qwitch.app/Contents/MacOS/qwitch"
          ARCHS="$(lipo -archs "$BIN")"
          echo "macOS binary architectures: $ARCHS (expected: $EXPECTED_ARCH)"
          if [[ " $ARCHS " != *" $EXPECTED_ARCH "* ]]; then
            echo "Expected $EXPECTED_ARCH slice, got: $ARCHS" >&2
            exit 1
          fi
          if [[ "$EXPECTED_ARCH" == "arm64" && " $ARCHS " == *" x86_64 "* ]]; then
            echo "arm64 build unexpectedly contains x86_64 slice" >&2
            exit 1
          fi
          if [[ "$EXPECTED_ARCH" == "x86_64" && " $ARCHS " == *" arm64 "* ]]; then
            echo "x86_64 build unexpectedly contains arm64 slice" >&2
            exit 1
          fi
          mkdir -p dist-release
          shopt -s nullglob
          cp src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg dist-release/
          ls -lh dist-release/

      - name: Stage Windows x64 artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist-release/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi dist-release/
          ls -lh dist-release/

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish formal GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi

          cat <<'EOF' > release-notes.md
          ### 下载说明 / Downloads

          - **macOS Apple Silicon (`*aarch64.dmg`)**：适用于 M1/M2/M3/M4 等 Apple Silicon Mac，原生 arm64，无需 Rosetta 2。
          - **macOS Intel (`*x64.dmg`)**：适用于 Intel 芯片 Mac，原生 x86_64。
          - 两个 macOS 包均为独立架构，下载体积比 Universal 通用包更小；请按芯片类型选择。首次打开若提示“已损坏”或无法验证开发者（暂未配置 Apple 公证签名），拖入 `/Applications` 后执行：
            ```bash
            xattr -cr /Applications/Qwitch.app
            ```
          - **Windows (`*x64-setup.exe` / `*x64*.msi`)**：适用于 Windows x64 桌面端安装。
          - **完整性校验**：下载后可对照 `SHA256SUMS.txt` 校验安装包哈希值。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_BODY="$(gh release view "$TAG" --json body -q .body || true)"
            gh release upload "$TAG" release-assets/* --clobber
            if [ -z "$EXISTING_BODY" ]; then
              gh release edit "$TAG" \
                --draft=false \
                "$RELEASE_FLAG" \
                --title "Qwitch $TAG" \
                --notes-file release-notes.md
            else
              gh release edit "$TAG" \
                --draft=false \
                "$RELEASE_FLAG" \
                --title "Qwitch $TAG"
            fi
          else
            gh release create "$TAG" release-assets/* \
              --target "${{ github.sha }}" \
              --title "Qwitch $TAG" \
              --notes "$(cat release-notes.md)" \
              --generate-notes \
              "$RELEASE_FLAG"
          fi
