<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" fill="none">
  <title>Qwitch icon direction 01 — Return Path</title>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.3px; }
      .title { font-size: 52px; font-weight: 700; letter-spacing: -1.6px; }
      .subtitle { font-size: 19px; font-weight: 400; }
      .section { font-size: 23px; font-weight: 700; letter-spacing: -.3px; }
      .body { font-size: 16px; font-weight: 400; }
      .small { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
      .tiny { font-size: 11px; font-weight: 600; letter-spacing: .6px; }
    </style>
    <symbol id="qwitch-mark" viewBox="0 0 128 128">
      <path d="M82 20C74.8 15 66.8 12 57 12C34.9 12 17 29.9 17 52C17 74.1 34.9 92 57 92C68.9 92 79.4 86.8 86.2 78.6" stroke="#F4F3EF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M81.5 74.5L100 95" stroke="#65D6B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M90 87L100 97L110 87" stroke="#65D6B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 105H111" stroke="#F4F3EF" stroke-width="8" stroke-linecap="round"/>
      <path d="M39 117H97" stroke="#8DA6A2" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="qwitch-mark-tray" viewBox="0 0 16 16">
      <path d="M9.7 2.1C8.8 1.5 7.8 1.2 6.7 1.2A5.1 5.1 0 1 0 11.2 8.7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9.6 7.9L12.5 10.9M10.4 10.9H12.6V8.7M2.1 13.4H13.9" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1600" height="1120" fill="#F4F3EF"/>
  <text x="78" y="62" class="sans eyebrow" fill="#56716E">QWITCH / BRAND MARK / DIRECTION 01</text>
  <path d="M78 83H132" stroke="#65D6B8" stroke-width="4" stroke-linecap="round"/>
  <rect x="1355" y="35" width="167" height="36" rx="18" fill="#E6EFEB"/>
  <text x="1438.5" y="58" text-anchor="middle" class="sans tiny" fill="#41635E">CONCEPT DRAFT</text>
  <text x="78" y="143" class="sans title" fill="#172A2F">Q 归位路径</text>
  <text x="80" y="179" class="sans subtitle" fill="#657471">把 Q 化作受控的会话轨迹：收好账号，由用户主动切换归位。</text>

  <!-- Hero lockup -->
  <rect x="78" y="220" width="926" height="565" rx="32" fill="#17343A"/>
  <circle cx="225" cy="502" r="156" fill="#22464B"/>
  <rect x="111" y="376" width="260" height="260" rx="72" fill="#17343A" stroke="#35565A" stroke-width="1.5"/>
  <use href="#qwitch-mark" x="120" y="385" width="242" height="242"/>
  <text x="425" y="469" class="sans" font-size="63" font-weight="700" letter-spacing="-2.1" fill="#F4F3EF">Qwitch</text>
  <text x="428" y="513" class="sans" font-size="14" font-weight="700" letter-spacing="2" fill="#8DA6A2">LOCAL-FIRST AI ACCOUNT &amp; QUOTA MANAGER</text>
  <text x="428" y="551" class="sans body" fill="#C6D5D0">本地 AI 工具账号与额度工作台</text>
  <path d="M428 589H939" stroke="#36565B" stroke-width="1.5"/>
  <text x="428" y="626" class="sans small" fill="#65D6B8">收纳会话</text>
  <circle cx="505" cy="621" r="2.5" fill="#63817D"/>
  <text x="525" y="626" class="sans small" fill="#D5E1DD">人工切换</text>
  <circle cx="606" cy="621" r="2.5" fill="#63817D"/>
  <text x="627" y="626" class="sans small" fill="#D5E1DD">本地可控</text>
  <text x="428" y="700" class="sans body" fill="#A8BCB6">标记不指向某个 AI 平台，而指向用户自己的会话工作台。</text>

  <!-- Meaning -->
  <rect x="1032" y="220" width="490" height="565" rx="32" fill="#FFFFFF" stroke="#DCE4E0" stroke-width="1.5"/>
  <text x="1070" y="276" class="sans eyebrow" fill="#6B8982">图形逻辑</text>
  <text x="1070" y="320" class="sans section" fill="#172A2F">Q、路径、底座</text>
  <text x="1070" y="355" class="sans body" fill="#657471">三个提示合成一个简单符号。</text>
  <path d="M1070 380H1484" stroke="#E7ECE9" stroke-width="1.5"/>

  <circle cx="1092" cy="431" r="17" fill="#E8F5EF"/>
  <text x="1092" y="436" text-anchor="middle" class="sans small" fill="#237462">01</text>
  <text x="1124" y="426" class="sans" font-size="17" font-weight="700" fill="#172A2F">Q 环</text>
  <text x="1124" y="451" class="sans body" fill="#657471">把品牌首字母变成可识别的主体。</text>

  <circle cx="1092" cy="519" r="17" fill="#E8F5EF"/>
  <text x="1092" y="524" text-anchor="middle" class="sans small" fill="#237462">02</text>
  <text x="1124" y="514" class="sans" font-size="17" font-weight="700" fill="#172A2F">落位路径</text>
  <text x="1124" y="539" class="sans body" fill="#657471">尾部指向一个明确位置，表达主动切换。</text>

  <circle cx="1092" cy="607" r="17" fill="#E8F5EF"/>
  <text x="1092" y="612" text-anchor="middle" class="sans small" fill="#237462">03</text>
  <text x="1124" y="602" class="sans" font-size="17" font-weight="700" fill="#172A2F">两层底座</text>
  <text x="1124" y="627" class="sans body" fill="#657471">隐喻本地收纳与稳定承载，不画锁或云。</text>

  <rect x="1070" y="674" width="414" height="73" rx="16" fill="#F3F7F5"/>
  <text x="1090" y="704" class="sans small" fill="#41635E">精修重点</text>
  <text x="1090" y="728" class="sans body" fill="#657471">保住 Q 的识别；小尺寸时优先减层，不减留白。</text>

  <!-- Application samples -->
  <rect x="78" y="815" width="1444" height="230" rx="28" fill="#FFFFFF" stroke="#DCE4E0" stroke-width="1.5"/>
  <path d="M558 846V1016M1048 846V1016" stroke="#E7ECE9" stroke-width="1.5"/>

  <text x="110" y="859" class="sans eyebrow" fill="#6B8982">01 / DOCK &amp; TASKBAR</text>
  <rect x="111" y="882" width="104" height="104" rx="29" fill="#17343A"/>
  <use href="#qwitch-mark" x="119" y="890" width="88" height="88"/>
  <text x="240" y="919" class="sans section" fill="#172A2F">应用图标</text>
  <text x="240" y="950" class="sans body" fill="#657471">保留完整的 Q、落位路径与双层底座。</text>
  <text x="240" y="978" class="sans small" fill="#87918E">彩色主版 · 深青灰底 / 薄荷绿强调</text>

  <text x="594" y="859" class="sans eyebrow" fill="#6B8982">02 / MENU BAR</text>
  <rect x="596" y="882" width="98" height="104" rx="18" fill="#F4F3EF"/>
  <g color="#17343A"><use href="#qwitch-mark-tray" x="625" y="901" width="40" height="40"/></g>
  <text x="713" y="919" class="sans section" fill="#172A2F">单色托盘版</text>
  <text x="713" y="950" class="sans body" fill="#657471">16 px 结构：Q 环、短尾、单条底线。</text>
  <text x="713" y="978" class="sans small" fill="#87918E">图中放大展示 · 实际按系统模板色绘制</text>

  <text x="1084" y="859" class="sans eyebrow" fill="#6B8982">03 / COLOR PALETTE</text>
  <rect x="1085" y="887" width="77" height="58" rx="13" fill="#17343A"/>
  <rect x="1176" y="887" width="77" height="58" rx="13" fill="#65D6B8"/>
  <rect x="1267" y="887" width="77" height="58" rx="13" fill="#F4F3EF" stroke="#DCE4E0" stroke-width="1.5"/>
  <rect x="1358" y="887" width="77" height="58" rx="13" fill="#8DA6A2"/>
  <text x="1123.5" y="970" text-anchor="middle" class="sans tiny" fill="#56716E">INK</text>
  <text x="1123.5" y="991" text-anchor="middle" class="sans small" fill="#172A2F">17343A</text>
  <text x="1214.5" y="970" text-anchor="middle" class="sans tiny" fill="#56716E">MINT</text>
  <text x="1214.5" y="991" text-anchor="middle" class="sans small" fill="#172A2F">65D6B8</text>
  <text x="1305.5" y="970" text-anchor="middle" class="sans tiny" fill="#56716E">WARM WHITE</text>
  <text x="1305.5" y="991" text-anchor="middle" class="sans small" fill="#172A2F">F4F3EF</text>
  <text x="1396.5" y="970" text-anchor="middle" class="sans tiny" fill="#56716E">SAGE</text>
  <text x="1396.5" y="991" text-anchor="middle" class="sans small" fill="#172A2F">8DA6A2</text>
  <text x="1085" y="1022" class="sans small" fill="#87918E">源自项目旧视觉研究的候选色，需和 Qwitch 正式 UI 一起校准。</text>
</svg>
