<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 深曜石炭黑底座渐变 -->
    <radialGradient id="bgGrad" cx="52%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#1E242D"/>
      <stop offset="60%" stop-color="#12161C"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </radialGradient>

    <!-- 右下角翡翠青环境微光 -->
    <radialGradient id="emeraldGlow" cx="62%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0D9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0"/>
    </radialGradient>

    <!-- 底座金属内描边 -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.18"/>
    </linearGradient>

    <!-- 折叠丝带：冷钛银外环段 -->
    <linearGradient id="silverRibbon" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="42%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- 折叠丝带：翡翠青转折段 -->
    <linearGradient id="emeraldRibbon" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- 折叠尾端拨片 -->
    <linearGradient id="tailRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- 立体投影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="tailShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- macOS 标准圆角矩形底座 -->
  <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="url(#emeraldGlow)"/>
  <rect x="34" y="34" width="956" height="956" rx="214" ry="214" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- 连续折叠光带 Q 主体 -->
  <g filter="url(#dropShadow)">
    <!-- 1. 右侧翡翠青立体翻折弧（从顶部中线无缝延展至右下） -->
    <path d="M 512 248
             C 672 248, 782 362, 782 510
             C 782 612, 720 698, 622 734
             C 574 752, 518 756, 466 746
             C 554 734, 658 656, 668 524
             C 678 390, 600 288, 512 248 Z"
          fill="url(#emeraldRibbon)"/>

    <!-- 2. 左侧及上方冷钛银主折带（无缝衔接顶部弧线） -->
    <path d="M 512 248
             C 348 248, 232 368, 232 512
             C 232 658, 348 766, 502 766
             C 552 766, 600 752, 638 728
             C 526 748, 356 664, 356 502
             C 356 364, 456 276, 576 280
             C 556 260, 534 248, 512 248 Z"
          fill="url(#silverRibbon)"/>

    <!-- 3. 右下角 45 度锐利折叠尾端（Switch 切角） -->
    <g filter="url(#tailShadow)">
      <path d="M 548 536
               L 744 732
               C 752 740, 752 752, 744 760
               L 692 812
               C 684 820, 672 820, 664 812
               L 468 616
               C 460 608, 460 596, 468 588
               L 520 536
               C 528 528, 540 528, 548 536 Z"
            fill="url(#tailRibbon)"/>
      <path d="M 534 532 L 740 738" stroke="#A7F3D0" stroke-width="3" stroke-opacity="0.65" stroke-linecap="round"/>
    </g>
  </g>
</svg>
