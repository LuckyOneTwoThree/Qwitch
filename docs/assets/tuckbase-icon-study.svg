<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" fill="none">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; }
      .title { font-size: 54px; font-weight: 700; letter-spacing: -1.8px; }
      .subtitle { font-size: 20px; font-weight: 400; }
      .card-title { font-size: 29px; font-weight: 700; letter-spacing: -.5px; }
      .card-copy { font-size: 17px; font-weight: 400; }
      .small { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#F4F3EF"/>

  <text x="86" y="74" class="sans eyebrow" fill="#5F7777">TUCKBASE / BRAND MARK STUDY 01</text>
  <path d="M86 98H138" stroke="#65D6B8" stroke-width="4" stroke-linecap="round"/>
  <text x="86" y="166" class="sans title" fill="#172A2F">归栈 <tspan fill="#81918E" font-weight="400">/</tspan> Tuckbase</text>
  <text x="88" y="207" class="sans subtitle" fill="#657471">本地有序地管理 AI 工具账号与会话 · 图标方向对比</text>

  <!-- Concept 01 -->
  <g>
    <rect x="78" y="260" width="456" height="536" rx="28" fill="#FFFFFF" stroke="#D4DFDA" stroke-width="2"/>
    <rect x="98" y="280" width="112" height="30" rx="15" fill="#E7F5EF"/>
    <text x="154" y="300" text-anchor="middle" class="sans small" fill="#237462">首选方向</text>
    <g transform="translate(226 320)">
      <rect width="160" height="160" rx="42" fill="#17343A"/>
      <path d="M105 27V43C105 56.255 94.255 67 81 67H61C47.745 67 37 77.745 37 91V106" stroke="#65D6B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 94L37 106L49 94" stroke="#65D6B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 119H136" stroke="#F4F3EF" stroke-width="7" stroke-linecap="round"/>
      <path d="M39 137H121" stroke="#8DA6A2" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="108" y="535" class="sans eyebrow" fill="#6C8A83">01 / RETURN PATH</text>
    <text x="108" y="583" class="sans card-title" fill="#172A2F">回栈轨迹</text>
    <text x="108" y="623" class="sans card-copy" fill="#596A67">一条路径回到层叠基座。</text>
    <text x="108" y="652" class="sans card-copy" fill="#596A67">“归”与“栈”在同一个符号里。</text>
    <path d="M108 690H504" stroke="#E9EEEB" stroke-width="1.5"/>
    <text x="108" y="727" class="sans small" fill="#237462">识别明确 · 便于做小尺寸图标</text>
    <text x="108" y="757" class="sans small" fill="#87938F">精修重点：箭头与底座的留白比例</text>
  </g>

  <!-- Concept 02 -->
  <g>
    <rect x="572" y="260" width="456" height="536" rx="28" fill="#FFFFFF" stroke="#E1E3DF" stroke-width="1.5"/>
    <g transform="translate(720 320)">
      <rect width="160" height="160" rx="42" fill="#263A45"/>
      <path d="M42 42H118" stroke="#65D6B8" stroke-width="13" stroke-linecap="round"/>
      <path d="M30 76H106" stroke="#F4F3EF" stroke-width="13" stroke-linecap="round"/>
      <path d="M54 110H130" stroke="#9EB3B3" stroke-width="13" stroke-linecap="round"/>
    </g>
    <text x="602" y="535" class="sans eyebrow" fill="#7A8581">02 / LAYERED BASE</text>
    <text x="602" y="583" class="sans card-title" fill="#172A2F">叠层基座</text>
    <text x="602" y="623" class="sans card-copy" fill="#596A67">错位层片形成稳定的底座。</text>
    <text x="602" y="652" class="sans card-copy" fill="#596A67">强调收纳与清晰结构。</text>
    <path d="M602 690H998" stroke="#E9EEEB" stroke-width="1.5"/>
    <text x="602" y="727" class="sans small" fill="#4B6968">极简 · 单色与托盘场景友好</text>
    <text x="602" y="757" class="sans small" fill="#87938F">注意：避免像数据库或文件夹</text>
  </g>

  <!-- Concept 03 -->
  <g>
    <rect x="1066" y="260" width="456" height="536" rx="28" fill="#FFFFFF" stroke="#E1E3DF" stroke-width="1.5"/>
    <g transform="translate(1214 320)">
      <rect width="160" height="160" rx="42" fill="#25363E"/>
      <circle cx="31" cy="43" r="6" fill="#65D6B8"/>
      <circle cx="31" cy="80" r="6" fill="#65D6B8"/>
      <circle cx="31" cy="117" r="6" fill="#65D6B8"/>
      <path d="M42 43H65C72 43 75 46 80 51L101 72" stroke="#A7C3BA" stroke-width="6" stroke-linecap="round"/>
      <path d="M42 80H101" stroke="#F4F3EF" stroke-width="6" stroke-linecap="round"/>
      <path d="M42 117H65C72 117 75 114 80 109L101 88" stroke="#A7C3BA" stroke-width="6" stroke-linecap="round"/>
      <path d="M96 65L111 80L96 95" stroke="#65D6B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1096" y="535" class="sans eyebrow" fill="#7A8581">03 / MANY TO ONE</text>
    <text x="1096" y="583" class="sans card-title" fill="#172A2F">多路汇流</text>
    <text x="1096" y="623" class="sans card-copy" fill="#596A67">多个入口汇到一个管理出口。</text>
    <text x="1096" y="652" class="sans card-copy" fill="#596A67">突出多工具、多账号的统一视图。</text>
    <path d="M1096 690H1492" stroke="#E9EEEB" stroke-width="1.5"/>
    <text x="1096" y="727" class="sans small" fill="#4B6968">表达直观 · 信息密度较高</text>
    <text x="1096" y="757" class="sans small" fill="#87938F">注意：易接近通用流程或网络符号</text>
  </g>

  <g>
    <rect x="78" y="838" width="1444" height="204" rx="30" fill="#17343A"/>
    <text x="118" y="894" class="sans eyebrow" fill="#8DB4A9">RECOMMENDATION</text>
    <text x="118" y="941" class="sans card-title" fill="#FFFFFF">优先精修 01「回栈轨迹」</text>
    <text x="118" y="980" class="sans card-copy" fill="#CEDBD6">用一条回归路径表达“归”，用两层基座表达“栈”；保持纯色成立。</text>
    <text x="118" y="1015" class="sans small" fill="#93AAA3">下一轮：检查 16 px / 24 px / 32 px，完善单色版、浅色版和深色版。</text>
    <g transform="translate(1250 884)">
      <rect width="96" height="96" rx="27" fill="#F4F3EF"/>
      <path d="M62 15V25C62 33 56 39 48 39H38C30 39 24 45 24 53V62" stroke="#17343A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 54L24 63L33 54" stroke="#17343A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 72H81" stroke="#17343A" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M24 84H72" stroke="#17343A" stroke-width="5.5" stroke-linecap="round"/>
    </g>
    <text x="1298" y="1008" text-anchor="middle" class="sans small" fill="#A6BBB4">单色符号测试</text>
  </g>
</svg>
