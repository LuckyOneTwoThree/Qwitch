[package]
name = "qwitch"
version = "0.5.1"
description = "Local-first multi-account session and daily quota manager for AI tools"
authors = ["Qwitch Contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "qwitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
aes = "0.8"
aes-gcm = "0.10"
# CodeArts 适配器：解密 Electron safeStorage（Chromium v10 = AES-128-CBC + PBKDF2-HMAC-SHA1）
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
rfd = "0.15"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
# HTTP 层集成测试：为适配器的 21 处 .send() 提供可编排的 7 态响应矩阵
# （200 正常 / 400 业务码 / 401 过期 / 403 风控 / 429 限流 / 5xx / 非 JSON）
wiremock = "0.6"
